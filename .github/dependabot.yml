# Dependabot — keeps the GitHub Actions the workflows use, and the npm
# packages, up to date.
#
# PR titles come out as "ci: bump …" and "chore: bump …", which pass the PR
# title check (docs/ci.md). Grouping keeps each ecosystem to one PR a week.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      npm:
        patterns: ["*"]
